CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_L2CAP_TX_BUF_COUNT=32
CONFIG_ZMK_USB_LOGGING=n
# 电池电量报告间隔时间单位是秒
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60


# set transmission power to max
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y



CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=10
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=10


# 增加键盘消抖
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=20
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=20

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n


# 启用键盘RGB功能
CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# 启用 LED 驱动框架
CONFIG_LED_STRIP=y

# 指定使用 NeoPixel（WS2812）驱动
CONFIG_WS2812_STRIP=y  # 注意：某些版本仍需保留此选项
# 或
#CONFIG_NEOPIXEL_STRIP=y  # 部分新版本可能合并到此选项

# 确保配置 RGB 数据引脚（例如 D0）
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y  # 若使用外部供电

CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

